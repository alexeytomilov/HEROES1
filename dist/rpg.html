<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Игра 1.2 · Поиск лагеря</title><link rel="icon" href="data:,"><link rel="stylesheet" href="style.css"></head>
<body data-game="rpg"><main><section class="preview"><nav aria-label="Масштаб"><button data-scale="1">×1</button><button data-scale="2" aria-pressed="true">×2</button><button data-scale="4">×4</button></nav><div id="viewport"><div id="screen"><canvas width="320" height="240" aria-label="Герои полуострова"></canvas></div></div><nav id="navigation" aria-label="Экраны"><button id="previous">Предыдущий</button><select id="screen-select" aria-label="Выбрать экран"></select><button id="next">Следующий</button></nav><nav id="race-tools" hidden><button id="race-start">Поехали</button><button id="race-pause">Пауза</button><button id="race-restart">Заново</button><button id="fog-sound">Звук: вкл</button></nav><nav id="fog-pad" hidden aria-label="Управление автомобилем"><button data-k="left" aria-label="Поворот влево">←</button><button data-k="right" aria-label="Поворот вправо">→</button><button data-k="down">Тормоз</button><button data-k="up">Газ</button><button data-k="horn">Гудок</button></nav><p id="race-help" class="hint" hidden>↑ / W — газ · ↓ / S — тормоз · ← → / A D — руль<br>Пробел — поехали · H — гудок · P — пауза</p><p id="status" role="status" aria-live="polite">Загрузка экранов…</p></section><aside aria-label="Технические настройки"><h1>Настройки экрана</h1><div class="colors"><label>Текст<input id="textColor" data-setting type="color" value="#bec4c9"></label><label>Линии<input id="lineColor" data-setting type="color" value="#91a1ad"></label></div><div class="colors"><label>Заголовок: фон<input id="headingBackground" data-setting type="color" value="#293640"></label><label>Заголовок: текст<input id="headingColor" data-setting type="color" value="#bec4c9"></label></div><label class="number">Межстрочный шаг, px<input id="lineStep" data-setting type="number" min="10" max="24" step="1" value="13"></label><label class="number">Отступ от края, px<input id="padding" data-setting type="number" min="0" max="24" step="1" value="5"></label><label class="number">Энергия / ресурсы: отступ от края, px<input id="resourcePadding" data-setting type="number" min="0" max="24" step="1" value="5"></label><label class="number">Текст рассказчика: верх-вниз, px<input id="narratorOffset" data-setting type="number" min="-60" max="60" step="1" value="0"></label><label class="number">Топливо / силы: верх-вниз, px<input id="resourceOffset" data-setting type="number" min="-20" max="20" step="1" value="1"></label><p class="hint">Плюс — вниз, минус — вверх.</p><button id="reset">Сбросить настройки</button></aside></main><script src="project-config.js?v=1"></script><script src="color-presets.js?v=zones-1"></script><script src="text-presets.js?v=zones-1"></script><script src="scene-settings.js?v=layered-1"></script><script src="config-transfer.js?v=fix-5"></script><script src="walk-view.js?v=3"></script><script src="rpg.js?v=continue-1"></script><script src="screen.js?v=continue-1"></script></body></html>
