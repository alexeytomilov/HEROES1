<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Настройки всплывающих окон</title><link rel="stylesheet" href="style.css"><style>.popup-panel{gap:12px}.popup-panel h1,.popup-panel p,.popup-panel a{grid-column:1/-1}.popup-panel select{font:inherit;color:#bec4c9;background:#080d14;border:1px solid #425873;padding:8px}.sample-toolbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.sample-toolbar button{font:inherit;background:#172231;color:#bec4c9;border:1px solid #425873;padding:8px}.back{color:#bec4c9}canvas{image-rendering:pixelated;image-rendering:crisp-edges}</style></head><body><main><section class="preview"><nav><button data-scale="1">×1</button><button data-scale="2" aria-pressed="true">×2</button><button data-scale="4">×4</button></nav><div id="viewport"><canvas id="popup-preview" width="320" height="240" style="width:640px;height:480px" aria-label="Предпросмотр всплывающего окна"></canvas></div><div class="sample-toolbar"><button data-sample="trip">Поездка</button><button data-sample="bear">Медведь</button><button data-sample="camp">Лагерь</button><button data-sample="win">Сообщение</button></div><p id="preview-status" class="hint">Загрузка…</p></section><aside class="popup-panel"><h1>Всплывающие окна</h1><a class="back" href="index.html">Вернуться к игре</a><p class="hint">Параметры общие для всех вопросов и сообщений. Размеры — в пикселях исходного экрана 320 × 240. Плашка увеличивается по высоте, если тексту нужно больше места.</p><div id="popup-fields"></div><button id="popup-reset">Сбросить настройки окон</button></aside></main><script src="project-config.js"></script><script src="config-transfer.js?v=2"></script><script src="current-ui.js?v=popup-1"></script><script src="popup-ui.js?v=1"></script><script src="popup-settings.js?v=1"></script></body></html>
