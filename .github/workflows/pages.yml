name: Publish game to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.artifact-name.outputs.name }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Name this publication artifact
        id: artifact-name
        run: echo 'name=github-pages-${{ github.run_id }}-${{ github.run_attempt }}' >> "$GITHUB_OUTPUT"
      - name: Stamp this build into file and level URLs so browsers never mix cached versions
        run: |
          build="${GITHUB_SHA::8}"
          sed -i -E "s/\.(js|css)\?v=[A-Za-z0-9._-]+/.\1?v=$build/g; s/\.(js|css)\"/.\1?v=$build\"/g" dist/*.html
          sed -i "s/__BUILD__/$build/g" dist/full-bridge.js
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          name: ${{ steps.artifact-name.outputs.name }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy game
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
